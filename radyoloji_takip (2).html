<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="RadAsistan">
<meta name="theme-color" content="#0a0e17">
<title>RadAsistan</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg:#0a0e17; --surface:#111827; --surface2:#1a2235; --border:#1e2d45;
  --accent:#00c2ff; --accent2:#7c3aed; --accent3:#10b981;
  --warn:#f59e0b; --danger:#ef4444; --text:#e2e8f0; --muted:#64748b;
  --ct:#00c2ff; --usg:#10b981; --mr:#a78bfa; --cr:#fbbf24;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
* { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
input { -webkit-user-select: text; user-select: text; }

html, body {
  height: 100%;
  background: var(--bg);
  color: var(--text);
  font-family: 'Syne', -apple-system, BlinkMacSystemFont, sans-serif;
  -webkit-text-size-adjust: 100%;
  overflow: hidden;
}

/* ── SHELL ─────────────────────────────────────────────────── */
.shell {
  display: flex;
  flex-direction: column;
  width: 100%;
  max-width: 430px;
  margin: 0 auto;
  height: 100dvh; /* dvh = iOS toolbar dahil doğru hesap */
  /* dvh desteklenmiyorsa fallback */
  height: calc(100vh - env(keyboard-inset-height, 0px));
  padding-top: env(safe-area-inset-top, 0px);
}

/* ── TOPBAR ────────────────────────────────────────────────── */
.topbar {
  flex-shrink: 0;
  padding: 14px 20px 12px;
  background: var(--bg);
  border-bottom: 1px solid var(--border);
  display: flex; align-items: center; justify-content: space-between;
}
.topbar-title { font-size: 18px; font-weight: 800; letter-spacing: -0.5px; }
.topbar-title span { color: var(--accent); }
.topbar-badge { background: var(--accent2); color: #fff; font-size: 11px; font-weight: 700; padding: 3px 10px; border-radius: 20px; font-family: 'DM Mono', monospace; }

/* ── SCROLL AREA ───────────────────────────────────────────── */
.scroll-area {
  flex: 1;
  position: relative;
  min-height: 0;
  overflow: hidden;
}

/* ── PAGES — her sayfanın kendi scroll'u var ────────────────── */
.page {
  display: none;
  position: absolute;
  inset: 0;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  overscroll-behavior-y: contain;
  padding: 16px 16px 40px;
  background: var(--bg);
}
.page.active { display: block; }

/* ── BOTTOM NAV ────────────────────────────────────────────── */
.bottom-nav {
  flex-shrink: 0;
  display: flex;
  background: var(--surface);
  border-top: 1px solid var(--border);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
.nav-btn {
  flex: 1; border: none; background: transparent; color: var(--muted);
  padding: 10px 0 8px; cursor: pointer;
  display: flex; flex-direction: column; align-items: center; gap: 3px;
  font-family: 'Syne', sans-serif; font-size: 10px; font-weight: 600;
  min-height: 50px;
}
.nav-btn.active { color: var(--accent); }
.nav-btn svg { width: 22px; height: 22px; }
.nav-btn:active { opacity: .6; }

/* ── BÖLÜM BAŞLIKLARI ──────────────────────────────────────── */
.st { font-size: 11px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; color: var(--muted); margin: 20px 0 10px; }
.st:first-child { margin-top: 0; }

/* ── STAT KARTLAR ──────────────────────────────────────────── */
.stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 12px; }
.stat-card { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 16px; position: relative; overflow: hidden; }
.stat-card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px; }
.sc-ct::before{background:var(--ct)} .sc-usg::before{background:var(--usg)} .sc-mr::before{background:var(--mr)} .sc-cr::before{background:var(--cr)}
.stat-label { font-size: 11px; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase; color: var(--muted); margin-bottom: 8px; }
.stat-val { font-family: 'DM Mono', monospace; font-size: 30px; font-weight: 500; line-height: 1; }
.sc-ct .stat-val{color:var(--ct)} .sc-usg .stat-val{color:var(--usg)} .sc-mr .stat-val{color:var(--mr)} .sc-cr .stat-val{color:var(--cr)}
.stat-sub { font-size: 11px; color: var(--muted); margin-top: 4px; font-family: 'DM Mono', monospace; }

.total-card { background: linear-gradient(135deg,var(--surface2),#0f1a2e); border: 1px solid var(--border); border-radius: 14px; padding: 16px 20px; display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
.total-label { font-size: 12px; font-weight: 700; color: var(--muted); }
.total-val { font-family: 'DM Mono', monospace; font-size: 26px; color: var(--text); }

.rot-grid { display: flex; flex-direction: column; gap: 8px; }
.rot-row { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 12px 16px; display: flex; align-items: center; justify-content: space-between; }
.rot-name { font-weight: 700; font-size: 14px; }
.rot-mo { font-family: 'DM Mono', monospace; font-size: 20px; color: var(--accent2); }
.rot-mo span { font-size: 12px; color: var(--muted); }

.prog-row { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
.prog-name { font-size: 12px; font-weight: 700; width: 90px; flex-shrink: 0; }
.prog-bg { flex: 1; height: 8px; background: var(--surface2); border-radius: 4px; overflow: hidden; }
.prog-fill { height: 100%; border-radius: 4px; }
.prog-val { font-family: 'DM Mono', monospace; font-size: 12px; color: var(--muted); width: 44px; text-align: right; flex-shrink: 0; }

/* ── FORM ───────────────────────────────────────────────────── */
.fc { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 18px; margin-bottom: 12px; }
.fl { font-size: 11px; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase; color: var(--muted); margin-bottom: 10px; display: block; }

.month-scroll { display: flex; gap: 8px; overflow-x: auto; -webkit-overflow-scrolling: touch; padding-bottom: 4px; }
.month-scroll::-webkit-scrollbar { display: none; }
.mchip { flex-shrink: 0; background: var(--surface2); border: 1px solid var(--border); border-radius: 8px; padding: 9px 14px; font-size: 12px; font-family: 'DM Mono', monospace; color: var(--muted); white-space: nowrap; min-height: 38px; display: flex; align-items: center; cursor: pointer; }
.mchip:active { opacity: .6; }
.mchip.sel { background: var(--accent); color: #000; border-color: var(--accent); font-weight: 700; }
.mchip.hd { border-color: var(--accent2); color: var(--accent2); }
.mchip.hd.sel { background: var(--accent); color: #000; border-color: var(--accent); }

.rot-opts { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 7px; }
.ropt { background: var(--surface2); border: 1px solid var(--border); border-radius: 10px; padding: 11px 4px; font-size: 12px; font-weight: 700; text-align: center; color: var(--muted); min-height: 44px; display: flex; align-items: center; justify-content: center; cursor: pointer; }
.ropt:active { opacity: .6; }
.ropt.sel { background: var(--accent2); color: #fff; border-color: var(--accent2); }

.toggle-wrap { padding: 10px 0 2px; display: flex; align-items: center; gap: 12px; margin-top: 6px; cursor: pointer; }
.tog-track { width: 51px; height: 31px; background: #3a3a3c; border-radius: 16px; position: relative; transition: background .2s; flex-shrink: 0; }
.tog-track.on { background: var(--warn); }
.tog-thumb { position: absolute; top: 2px; left: 2px; width: 27px; height: 27px; background: #fff; border-radius: 50%; transition: transform .2s; box-shadow: 0 2px 6px rgba(0,0,0,.4); }
.tog-track.on .tog-thumb { transform: translateX(20px); }
.tog-label { font-size: 14px; font-weight: 600; color: var(--text); }
.tog-sub { font-size: 11px; color: var(--muted); margin-left: auto; font-family: 'DM Mono'; }

.mod-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.mod-lbl { display: flex; align-items: center; gap: 6px; margin-bottom: 6px; font-size: 12px; font-weight: 700; }
.mod-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
.mod-inp {
  width: 100%; background: var(--surface2); border: 1.5px solid var(--border);
  border-radius: 10px; padding: 13px 8px; color: var(--text);
  font-family: 'DM Mono', monospace; font-size: 24px; text-align: center;
  outline: none; -webkit-appearance: none; appearance: none;
  min-height: 56px; transition: border-color .15s;
  -moz-appearance: textfield;
}
.mod-inp::-webkit-outer-spin-button, .mod-inp::-webkit-inner-spin-button { -webkit-appearance: none; }
.mod-inp:focus { border-color: var(--accent); }
.mod-inp.ct:focus{border-color:var(--ct)} .mod-inp.usg:focus{border-color:var(--usg)} .mod-inp.mr:focus{border-color:var(--mr)} .mod-inp.cr:focus{border-color:var(--cr)}

.save-btn { width: 100%; background: linear-gradient(135deg,var(--accent),#0080cc); border: none; border-radius: 14px; color: #000; font-family: 'Syne',sans-serif; font-size: 16px; font-weight: 800; padding: 17px; cursor: pointer; -webkit-appearance: none; min-height: 54px; margin-top: 4px; }
.save-btn:active { opacity: .75; }

/* ── TABLO ──────────────────────────────────────────────────── */
.tbl-outer { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; overflow: hidden; }
.tbl-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }
table { width: 100%; border-collapse: collapse; font-size: 12px; }
th { background: var(--surface2); color: var(--muted); padding: 8px 10px; text-align: left; font-size: 10px; letter-spacing: 1px; text-transform: uppercase; border-bottom: 1px solid var(--border); font-family: 'DM Mono', monospace; white-space: nowrap; }
td { padding: 11px 10px; border-bottom: 1px solid var(--border); font-family: 'DM Mono', monospace; vertical-align: middle; }
tr:last-child td { border-bottom: none; }
.rpill { display: inline-block; background: var(--surface2); border-radius: 6px; padding: 3px 8px; font-size: 11px; font-weight: 700; color: var(--accent2); font-family: 'Syne', sans-serif; }
.rpill.half { color: var(--warn); }
.nct{color:var(--ct)} .nusg{color:var(--usg)} .nmr{color:var(--mr)} .ncr{color:var(--cr)} .nz{color:var(--border)}
.del-btn { background: none; border: none; color: var(--muted); cursor: pointer; min-width: 36px; min-height: 44px; display: flex; align-items: center; justify-content: center; font-size: 14px; border-radius: 8px; }
.del-btn:active { color: var(--danger); }

/* ── TOAST ──────────────────────────────────────────────────── */
.toast { position: fixed; bottom: calc(env(safe-area-inset-bottom,0px) + 72px); left: 50%; transform: translateX(-50%) translateY(12px); background: var(--accent3); color: #fff; padding: 11px 22px; border-radius: 20px; font-size: 13px; font-weight: 700; opacity: 0; transition: opacity .22s, transform .22s; pointer-events: none; z-index: 999; white-space: nowrap; box-shadow: 0 4px 20px rgba(0,0,0,.5); }
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
.toast.err { background: var(--danger); }

/* install banner */
.ibanner { background: var(--surface2); border: 1px solid var(--accent2); border-radius: 12px; padding: 12px 14px; margin-bottom: 14px; display: flex; align-items: center; gap: 10px; font-size: 12px; line-height: 1.5; }
.iclose { background: none; border: none; color: var(--muted); font-size: 18px; cursor: pointer; min-width: 32px; min-height: 32px; display: flex; align-items: center; justify-content: center; margin-left: auto; flex-shrink: 0; }
</style>
</head>
<body>
<div class="shell">

  <div class="topbar">
    <div class="topbar-title">Rad<span>Asistan</span></div>
    <div class="topbar-badge" id="badge">— vaka</div>
  </div>

  <div class="scroll-area" id="scroll-area">

    <!-- PANEL -->
    <div class="page active" id="pg-dash">
      <div id="ibanner" class="ibanner" style="display:none">
        <div style="font-size:22px">🩻</div>
        <div style="color:var(--text)"><strong style="color:var(--accent2);display:block">Ana Ekrana Ekle</strong>Safari → Paylaş ↑ → "Ana Ekrana Ekle"</div>
        <button class="iclose" onclick="dismissBanner()">✕</button>
      </div>
      <div class="st">📊 Modalite Toplamları</div>
      <div class="stats-grid">
        <div class="stat-card sc-ct"><div class="stat-label">CT</div><div class="stat-val" id="t-ct">0</div><div class="stat-sub">tetkik</div></div>
        <div class="stat-card sc-usg"><div class="stat-label">USG</div><div class="stat-val" id="t-usg">0</div><div class="stat-sub">tetkik</div></div>
        <div class="stat-card sc-mr"><div class="stat-label">MR</div><div class="stat-val" id="t-mr">0</div><div class="stat-sub">tetkik</div></div>
        <div class="stat-card sc-cr"><div class="stat-label">CR</div><div class="stat-val" id="t-cr">0</div><div class="stat-sub">tetkik</div></div>
      </div>
      <div class="total-card">
        <div><div class="total-label">TOPLAM VAKA</div><div style="font-size:11px;color:var(--muted);margin-top:2px">tüm modaliteler</div></div>
        <div class="total-val" id="t-grand">0</div>
      </div>
      <div class="st" style="margin-top:22px">🏥 Rotasyon Süreleri</div>
      <div class="rot-grid" id="rot-grid"></div>
      <div class="st" style="margin-top:22px">📈 Dağılım</div>
      <div id="mod-bars"></div>
    </div>

    <!-- VERİ GİR -->
    <div class="page" id="pg-entry">
      <div class="fc">
        <label class="fl">📅 Ay</label>
        <div class="month-scroll" id="mscroll"></div>
      </div>
      <div class="fc">
        <label class="fl">🔬 Rotasyon</label>
        <div class="rot-opts" id="ropts"></div>
        <div class="toggle-wrap" onclick="toggleHalf()">
          <div class="tog-track" id="tog"><div class="tog-thumb"></div></div>
          <div class="tog-label">Yarım Ay</div>
          <div class="tog-sub" id="tog-sub">tam ay</div>
        </div>
      </div>
      <div class="fc">
        <label class="fl">📋 Vaka Sayıları</label>
        <div class="mod-grid">
          <div><div class="mod-lbl"><div class="mod-dot" style="background:var(--ct)"></div>CT</div><input type="number" inputmode="numeric" pattern="[0-9]*" class="mod-inp ct" id="i-ct" placeholder="0" min="0" autocomplete="off"></div>
          <div><div class="mod-lbl"><div class="mod-dot" style="background:var(--usg)"></div>USG</div><input type="number" inputmode="numeric" pattern="[0-9]*" class="mod-inp usg" id="i-usg" placeholder="0" min="0" autocomplete="off"></div>
          <div><div class="mod-lbl"><div class="mod-dot" style="background:var(--mr)"></div>MR</div><input type="number" inputmode="numeric" pattern="[0-9]*" class="mod-inp mr" id="i-mr" placeholder="0" min="0" autocomplete="off"></div>
          <div><div class="mod-lbl"><div class="mod-dot" style="background:var(--cr)"></div>CR</div><input type="number" inputmode="numeric" pattern="[0-9]*" class="mod-inp cr" id="i-cr" placeholder="0" min="0" autocomplete="off"></div>
        </div>
      </div>
      <button class="save-btn" onclick="saveEntry()">💾 Kaydet</button>
    </div>

    <!-- KAYITLAR -->
    <div class="page" id="pg-table">
      <div class="st">📋 Tüm Kayıtlar</div>
      <div class="tbl-outer">
        <div class="tbl-wrap">
          <table>
            <thead><tr><th>AY</th><th>ROTASYON</th><th>CT</th><th>USG</th><th>MR</th><th>CR</th><th></th></tr></thead>
            <tbody id="tbody"></tbody>
          </table>
        </div>
      </div>
    </div>

  </div><!-- /scroll-area -->

  <nav class="bottom-nav">
    <button class="nav-btn active" id="nb-dash" onclick="goPage('dash')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>Panel
    </button>
    <button class="nav-btn" id="nb-entry" onclick="goPage('entry')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/></svg>Veri Gir
    </button>
    <button class="nav-btn" id="nb-table" onclick="goPage('table')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>Kayıtlar
    </button>
  </nav>

</div>
<div class="toast" id="toast"></div>

<script>
const ROTS = ['Toraks','Nöro','Abdomen','USG','Kas iskelet','Meme','Girişimsel'];
const RCOL = {Toraks:'#00c2ff',Nöro:'#a78bfa',Abdomen:'#10b981',USG:'#fbbf24','Kas iskelet':'#f97316',Meme:'#ec4899',Girişimsel:'#6ee7b7'};
const SEED = [
  {m:'2024-09',r:'Toraks', h:1,ct:0,  u:0, mr:0,  cr:0},
  {m:'2024-10',r:'Toraks', h:0,ct:0,  u:0, mr:0,  cr:0},
  {m:'2024-11',r:'Toraks', h:0,ct:413,u:0, mr:0,  cr:4},
  {m:'2024-12',r:'Nöro',   h:0,ct:487,u:0, mr:0,  cr:0},
  {m:'2025-01',r:'Nöro',   h:0,ct:625,u:0, mr:0,  cr:2},
  {m:'2025-02',r:'Abdomen',h:0,ct:119,u:0, mr:0,  cr:0},
  {m:'2025-03',r:'USG',    h:0,ct:0,  u:0, mr:0,  cr:31},
  {m:'2025-04',r:'USG',    h:0,ct:0,  u:0, mr:0,  cr:0},
  {m:'2025-05',r:'Abdomen',h:0,ct:791,u:0, mr:0,  cr:3},
  {m:'2025-06',r:'USG',    h:1,ct:45, u:0, mr:0,  cr:6},
  {m:'2025-07',r:'Nöro',   h:0,ct:743,u:0, mr:122,cr:0},
  {m:'2025-08',r:'Kas iskelet',h:0,ct:47,u:0,mr:0,cr:0},
  {m:'2025-09',r:'Toraks', h:0,ct:495,u:0, mr:0,  cr:48},
  {m:'2025-10',r:'USG',    h:0,ct:7,  u:0, mr:0,  cr:0},
  {m:'2025-11',r:'USG',    h:0,ct:29, u:2, mr:2,  cr:4},
  {m:'2025-12',r:'Nöro',   h:0,ct:943,u:0, mr:140,cr:10},
  {m:'2026-01',r:'Abdomen',h:0,ct:1007,u:0,mr:0,  cr:3},
  {m:'2026-02',r:'Nöro',   h:0,ct:600,u:0, mr:90, cr:0},
  {m:'2026-03',r:'Nöro',   h:0,ct:0,  u:0, mr:0,  cr:0},
];

function ld(){try{const s=localStorage.getItem('rv5');return s?JSON.parse(s):JSON.parse(JSON.stringify(SEED));}catch{return JSON.parse(JSON.stringify(SEED));}}
function sv(d){try{localStorage.setItem('rv5',JSON.stringify(d));}catch{}}
let D=ld();

function tots(){return{ct:D.reduce((s,r)=>s+(r.ct||0),0),u:D.reduce((s,r)=>s+(r.u||0),0),mr:D.reduce((s,r)=>s+(r.mr||0),0),cr:D.reduce((s,r)=>s+(r.cr||0),0)};}
function rotMo(rot){const f=D.filter(r=>r.r===rot&&!r.h).length,h=D.filter(r=>r.r===rot&&r.h).length;return f+h*.5;}
function fmt(m){const[y,mo]=m.split('-');return['','Oca','Şub','Mar','Nis','May','Haz','Tem','Ağu','Eyl','Eki','Kas','Ara'][+mo]+'.'+y.slice(2);}

let _tt;
function toast(msg,err=0){clearTimeout(_tt);const t=document.getElementById('toast');t.textContent=msg;t.className='toast show'+(err?' err':'');_tt=setTimeout(()=>t.className='toast',2600);}

function initBanner(){if(/iphone|ipad|ipod/i.test(navigator.userAgent)&&!navigator.standalone&&!localStorage.getItem('rb'))document.getElementById('ibanner').style.display='flex';}
function dismissBanner(){document.getElementById('ibanner').style.display='none';localStorage.setItem('rb','1');}

// ── NAV ────────────────────────────────────────────────────────
let cur='dash';
const PAGES={dash:'pg-dash',entry:'pg-entry',table:'pg-table'};
const NAVS ={dash:'nb-dash',entry:'nb-entry',table:'nb-table'};

function goPage(p){
  document.getElementById(PAGES[cur]).classList.remove('active');
  document.getElementById(NAVS[cur]).classList.remove('active');
  document.getElementById(PAGES[p]).classList.add('active');
  document.getElementById(NAVS[p]).classList.add('active');
  cur = p;
  // Sadece ilk açılışta render et, sonra state korunur
  if(p==='dash')  renderDash();
}

// ── DASHBOARD ───────────────────────────────────────────────────
function renderDash(){
  const t=tots(), g=t.ct+t.u+t.mr+t.cr;
  document.getElementById('t-ct').textContent=t.ct.toLocaleString('tr');
  document.getElementById('t-usg').textContent=t.u.toLocaleString('tr');
  document.getElementById('t-mr').textContent=t.mr.toLocaleString('tr');
  document.getElementById('t-cr').textContent=t.cr.toLocaleString('tr');
  document.getElementById('t-grand').textContent=g.toLocaleString('tr');
  document.getElementById('badge').textContent=g.toLocaleString('tr')+' vaka';

  const rd=ROTS.map(r=>({n:r,mo:rotMo(r)})).filter(r=>r.mo>0);
  document.getElementById('rot-grid').innerHTML=rd.length
    ?rd.map(r=>`<div class="rot-row"><div><div class="rot-name" style="color:${RCOL[r.n]||'var(--text)'}">${r.n}</div><div style="font-size:11px;color:var(--muted);margin-top:2px">rotasyonu</div></div><div class="rot-mo">${r.mo%1===0?r.mo:r.mo.toFixed(1)} <span>ay</span></div></div>`).join('')
    :'<div style="padding:16px;color:var(--muted);font-size:13px;text-align:center">Henüz veri yok</div>';

  const mods=[{n:'CT',v:t.ct,c:'var(--ct)'},{n:'USG',v:t.u,c:'var(--usg)'},{n:'MR',v:t.mr,c:'var(--mr)'},{n:'CR',v:t.cr,c:'var(--cr)'}];
  const mx=Math.max(...mods.map(m=>m.v),1);
  document.getElementById('mod-bars').innerHTML=mods.map(m=>`<div class="prog-row"><div class="prog-name" style="color:${m.c};font-family:'DM Mono',monospace">${m.n}</div><div class="prog-bg"><div class="prog-fill" style="width:${(m.v/mx*100).toFixed(1)}%;background:${m.c}"></div></div><div class="prog-val">${m.v.toLocaleString('tr')}</div></div>`).join('');
}

// ── VERİ GİRİŞ ─────────────────────────────────────────────────
let sM=null, sR=null, half=0;

function genMonths(){const a=[],n=new Date();for(let i=-18;i<=12;i++){const d=new Date(n.getFullYear(),n.getMonth()+i,1);a.push(d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'));}return a;}

function renderEntry(){
  const months=genMonths();
  const now=new Date().getFullYear()+'-'+String(new Date().getMonth()+1).padStart(2,'0');
  if(!sM)sM=now;

  // Ay seçici
  document.getElementById('mscroll').innerHTML=months.map(m=>{
    const hd=D.some(r=>r.m===m), sel=m===sM;
    return`<div class="mchip${sel?' sel':''}${hd&&!sel?' hd':''}" onclick="pickM('${m}')">${fmt(m)}</div>`;
  }).join('');
  // Seçili aya scroll
  setTimeout(()=>{
    const chips=document.querySelectorAll('.mchip');
    const idx=months.indexOf(sM);
    if(chips[idx])chips[idx].scrollIntoView({inline:'center',block:'nearest'});
  },60);

  // Rotasyon
  document.getElementById('ropts').innerHTML=ROTS.map(r=>`<div class="ropt${sR===r?' sel':''}" onclick="pickR('${r}')">${r}</div>`).join('');

  updateTog();
  fillExisting();
}

function pickM(m){
  sM=m;
  document.querySelectorAll('.mchip').forEach(el=>{
    const em=el.getAttribute('onclick').match(/'([^']+)'/)[1];
    const hd=D.some(r=>r.m===em);
    el.className='mchip'+(em===m?' sel':'')+(hd&&em!==m?' hd':'');
  });
  fillExisting();
}
function pickR(r){
  sR=r;
  document.querySelectorAll('.ropt').forEach(el=>el.className='ropt'+(el.textContent.trim()===r?' sel':''));
  updateTog();
}
function toggleHalf(){half=half?0:1;updateTog();}
function updateTog(){
  document.getElementById('tog').className='tog-track'+(half?' on':'');
  document.getElementById('tog-sub').textContent=half?(sR?sR+'/2':'yarım ay'):'tam ay';
}
function fillExisting(){
  const ex=D.find(r=>r.m===sM);
  if(ex){
    if(!sR){sR=ex.r;document.querySelectorAll('.ropt').forEach(el=>el.className='ropt'+(el.textContent.trim()===sR?' sel':''));}
    half=ex.h||0;
    document.getElementById('i-ct').value=ex.ct||'';
    document.getElementById('i-usg').value=ex.u||'';
    document.getElementById('i-mr').value=ex.mr||'';
    document.getElementById('i-cr').value=ex.cr||'';
    updateTog();
  } else {
    document.getElementById('i-ct').value='';
    document.getElementById('i-usg').value='';
    document.getElementById('i-mr').value='';
    document.getElementById('i-cr').value='';
  }
}
function saveEntry(){
  if(!sM){toast('⚠️ Ay seçin',1);return;}
  if(!sR){toast('⚠️ Rotasyon seçin',1);return;}
  const e={m:sM,r:sR,h:half,ct:parseInt(document.getElementById('i-ct').value)||0,u:parseInt(document.getElementById('i-usg').value)||0,mr:parseInt(document.getElementById('i-mr').value)||0,cr:parseInt(document.getElementById('i-cr').value)||0};
  const idx=D.findIndex(r=>r.m===sM);
  if(idx>=0){D[idx]=e;toast('✅ '+fmt(sM)+' güncellendi');}
  else{D.push(e);D.sort((a,b)=>a.m.localeCompare(b.m));toast('✅ '+fmt(sM)+' kaydedildi');}
  sv(D);
  const t=tots();document.getElementById('badge').textContent=(t.ct+t.u+t.mr+t.cr).toLocaleString('tr')+' vaka';
}

// ── TABLO ───────────────────────────────────────────────────────
function renderTable(){
  const tb=document.getElementById('tbody');
  if(!D.length){tb.innerHTML='<tr><td colspan="7" style="text-align:center;padding:28px;color:var(--muted)">Henüz kayıt yok</td></tr>';return;}
  tb.innerHTML=[...D].sort((a,b)=>b.m.localeCompare(a.m)).map(r=>`<tr><td style="white-space:nowrap;font-size:11px;color:var(--muted)">${fmt(r.m)}</td><td><span class="rpill${r.h?' half':''}">${r.r}${r.h?'/2':''}</span></td><td class="${r.ct?'nct':'nz'}">${r.ct||'—'}</td><td class="${r.u?'nusg':'nz'}">${r.u||'—'}</td><td class="${r.mr?'nmr':'nz'}">${r.mr||'—'}</td><td class="${r.cr?'ncr':'nz'}">${r.cr||'—'}</td><td><button class="del-btn" onclick="delEntry('${r.m}')">✕</button></td></tr>`).join('');
}
function delEntry(m){if(!confirm(fmt(m)+' kaydını silmek istiyor musun?'))return;D=D.filter(r=>r.m!==m);sv(D);renderTable();toast('🗑️ '+fmt(m)+' silindi');}

// ── BAŞLAT ──────────────────────────────────────────────────────
initBanner();
renderDash();
// Entry ve table'ı da önceden render et — iOS'ta geçişte boş görünmesin
renderEntry();
renderTable();
</script>
</body>
